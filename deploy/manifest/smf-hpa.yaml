# Default Kubernetes autoscaling for the SMF, on CPU.
#
# Apply this OR smf-autoscaler.yaml, not both — two controllers driving the same
# deployment will fight. Requires metrics-server and CPU requests on the pods
# (smf.yaml sets 200m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smf-hpa
  namespace: etri6g
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smf-slice1-dep
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
