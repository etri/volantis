apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: etri6g
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eth1",
      "mode": "bridge",
      "capabilities": {
        "ips": true
        },
      "ipam": {
        "type": "host-local",
        "subnet":"192.168.0.0/24"
      }
    }
