apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf-slice1-dep
  namespace: etri6g
  labels:
    nfType: smf
  annotations:
    autoscaling.volantis/state-port: "7001"
    autoscaling.volantis/state-path: "/state"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smf
      slice: 1-010203
  template:
    metadata:
      labels:
        app: smf
        plmnId: 001-01
        slice: 1-010203
        region: seoul
    spec:
      volumes:
        - name: smf-config
          configMap:
            name: smf-slice1-config

      containers:
        - name: smf
          image: 192.168.0.14:5000/b5gc-smf:latest
          imagePullPolicy: IfNotPresent
          command: ["./smf"]
          args: ["-c", "/etc/config/smf.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: smf-config

          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"

          ports:
            - containerPort: 9001
            - containerPort: 7001

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-slice1-config 
  namespace: etri6g
data:
  smf.json: |
    {
      "plmnId": {
        "mcc": "001",
        "mnc": "01"
      },
      "slice": {
        "sst" : 1,
        "sd": "010203"
      },
      "mesh": {
        "registrar": "10.100.100.1"
      }
    }
