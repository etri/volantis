apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsm-dep
  namespace: etri6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nsm
  template:
    metadata:
      labels:
        app: nsm
        plmnId: 001-01
    spec:
      volumes:
        - name: nsm-config
          configMap:
            name: nsm-config

      containers:
        - name: nsm
          image: 192.168.0.14:5000/b5gc-nsm:latest
          imagePullPolicy: IfNotPresent
          command: ["./nsm"]
          args: ["-c", "/etc/config/nsm.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: nsm-config

          ports:
            - containerPort: 9001
            - containerPort: 7001

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
