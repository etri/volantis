apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsm-dep
  namespace: etri6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nsm
  template:
    metadata:
      labels:
        app: nsm
        plmnId: 001-01
    spec:
      volumes:
        - name: nsm-config
          configMap:
            name: nsm-config

      containers:
        - name: nsm
          image: ghcr.io/reogac/volantis/nsm:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["./nsm"]
          args: ["-c", "/etc/config/nsm.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: nsm-config

          ports:
            - containerPort: 9001
            - containerPort: 7001

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nsm-config
  namespace: etri6g
# SUCI de-concealment keys are deliberately empty here. UEs using the null scheme need
# none. To support profile A or B, add entries to "suciProfiles" and keep them out of
# version control:
#
#   {"scheme": 1, "prvkey": "<32-byte hex>", "pubkey": "<32-byte hex>"}
#   {"scheme": 2, "prvkey": "<32-byte hex>", "pubkey": "<65-byte hex>"}
#
# This file also carries the subscriber database URL, so prefer a Secret over a
# ConfigMap once real values are in it.
data:
  nsm.json: |
    {
      "plmnId": {
        "mcc": "001",
        "mnc": "01"
      },
      "transportNetworks":["an1","an2","tran1","tran2"],
      "dataNetworks": [{
          "name": "internet",
          "cidr": "10.0.0.0/8",
          "numIpPools": 20
        },{
          "name": "etri",
          "cidr": "129.254.195.0/24",
          "dhcpServer": "129.254.195.100"
        }],
      "slices": [{
        "id":{
          "sd":"010203",
          "sst":1
        },
        "dataNetworks":["internet"]
      },{
        "id":{
          "sd":"543210",
          "sst":1
        },
        "dataNetworks":["internet"]
      }],
      "amfSets":[{
        "setId":"10-100",
        "slices": [{
            "sd":"010203",
            "sst":1
          },{
            "sd":"543210",
            "sst":1
          }]
        },{
          "setId":"10-101",
          "slices": [{
              "sd":"010203",
              "sst":1
          }]
        },{
          "setId":"10-102",
          "slices": [{
              "sd":"010203",
              "sst":1
          }]
          }],
      "udr": {
        "url": "mongodb://192.168.0.20:30001",
        "dbName": "etrib5gc",
        "authSub": "authsub",
        "amSub": "amsub",
        "smfSel": "smfsel",
        "smSub": "smsub",
        "mock": false
      },
      "suciProfiles":[],
      "mesh": {
        "registrar": "10.100.100.1"
      }
    }
