apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  namespace: etri6g
spec:
  selector:
    matchLabels:
      app: udr
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: udr
    spec:
      containers:
        - name: mongo-db
          image: mongo
          imagePullPolicy: Always
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongodb-persistent-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-persistent-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: udr-mongo
  namespace: etri6g
  labels:
    app: udr
spec:
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      nodePort: 30001
  type: NodePort
  selector:
    app: udr 
  clusterIP: 10.100.100.100

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: etri6g
  labels:
    app: udr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp2

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  namespace: etri6g
spec:
  storageClassName: gp2
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/db

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp2
  namespace: etri6g
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
