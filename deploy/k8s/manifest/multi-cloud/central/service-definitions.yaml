---
apiVersion: v1
kind: Service
metadata:
  name: damf-001-01
  namespace: volantis
  labels:
    type: network-function
  annotations:
    mesh.volantis.io/definition: |
      {
        "stateful": true,
        "groups": {
          "central": {
            "selectors": {
              "_gw-cloud": "central"
            }
          },
          "edge1": {
            "selectors": {
              "_gw-cloud": "edge1"
            }
          },
          "edge2": {
            "selectors": {
              "_gw-cloud": "edge2"
            }
          }
        },
        "routes": [
          {
            "from": {
              "cloud": "central"
            },
            "fallthrough": true,
            "destinations": [
              {
                "group": "central",
                "weight": 100
              }
            ]
          },
          {
            "from": {
              "cloud": "edge1"
            },
            "fallthrough": true,
            "destinations": [
              {
                "group": "edge1",
                "weight": 100
              }
            ]
          },
          {
            "from": {
              "cloud": "edge2"
            },
            "fallthrough": true,
            "destinations": [
              {
                "group": "edge2",
                "weight": 100
              }
            ]
          }
        ]
      }
  # DAMF, one per cloud. PRAN is the consumer, and it declares its cloud in
  # its own mesh.labels (each cloud's pran.yaml), so a gNB attaching in edge1
  # is authenticated by the edge1 DAMF.
spec:
  clusterIP: None
  selector:
    app: "damf"
    plmnId: "001-01"
  ports:
    - name: sbi
      protocol: TCP
      port: 9001

---
apiVersion: v1
kind: Service
metadata:
  name: amf-001-01
  namespace: volantis
  labels:
    type: network-function
  # The set-less AMF identity: every AMF pod in every cloud is a member.
  # No routes — this is the umbrella a consumer subscribes to when it does
  # not care which set, and the per-set definitions below are where
  # selection actually happens.
spec:
  clusterIP: None
  selector:
    app: "amf"
    plmnId: "001-01"
  ports:
    - name: sbi
      protocol: TCP
      port: 9001

