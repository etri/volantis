# SMF for slice 1-010203.
#
# The slice is the unit: an SMF instance serves exactly one S-NSSAI, so a second
# slice is a second Deployment, never a replica. NSM hands each instance one UE
# IP address segment per address space through its own claim — separate from the
# configuration read, which is why an SMF now re-reads its data networks every
# refresh — and reclaims it when the endpoint leaves. `segmentLength` in nsm.yaml
# is what bounds how many SMF instances an address space can serve across all
# three clouds.
#
# UPF selection is *not* the mesh's: the SMF runs Dijkstra over the UPFs that
# serve its slice and starts from a UPF interface on one of the transport
# networks the RAN reported. That is what makes a
# session from a gNB on tran-edge1 land on the edge1 UPF — see README.md §2.
#
# `mesh.labels` in a pod's config does **not** set this endpoint's labels — in
# Kubernetes the gateway takes those from the pod through the API server, and
# whatever the NF sent is discarded. What it does set is the agent's *own* view
# of itself, which is the only thing a route's `from` matcher is compared
# against. So `cloud` here is how
# this NF says "I am in central" when it *consumes*; the `_gw-cloud` label the
# gateway stamps on it is how it is seen when it *produces*. Both are needed and
# they are set in different places for that reason — see
# service-definitions.yaml.

apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-1-010203-config
  namespace: volantis
data:
  smf.json: |
    {
      "plmnId": {
        "mcc": "001",
        "mnc": "01"
      },
      "slice": {
        "sst": 1,
        "sd": "010203"
      },
      "mesh": {
        "registrar": "gateway-svc.volantis.svc.cluster.local:7777",
        "labels": {
          "cloud": "central"
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf-1-010203-dep
  namespace: volantis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "smf"
      plmnId: "001-01"
      slice: "1-010203"
  template:
    metadata:
      labels:
        app: "smf"
        plmnId: "001-01"
        slice: "1-010203"
    spec:
      volumes:
        - name: nf-config
          configMap:
            name: smf-1-010203-config
      containers:
        - name: smf
          image: volantis-smf:latest
          imagePullPolicy: IfNotPresent
          command: ["./smf"]
          args: ["-c", "/etc/config/smf.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: nf-config
          ports:
            - name: sbi
              containerPort: 9001
            - name: agent
              containerPort: 7001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          # /ready on the agent port is the mesh's own answer to "is this
          # instance selectable": 503 with "active": false until the NF has
          # pulled its configuration from NSM and opened its SBI gate. Across
          # clouds that pull crosses the gateway proxy, so an edge NF stays
          # unready a little longer than a central one.
          readinessProbe:
            httpGet:
              path: /ready
              port: 7001
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # the gateway reads this pod through the API server to take its
            # labels; POD_NAME/POD_NAMESPACE are how it is told which pod
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
