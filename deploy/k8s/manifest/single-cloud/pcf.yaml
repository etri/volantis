# PCF. Queries the UDR (MongoDB) directly for policy data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pcf-config
  namespace: volantis
data:
  pcf.json: |
    {
      "plmnId": {
        "mcc": "001",
        "mnc": "01"
      },
      "mesh": {
        "registrar": "gateway-svc.volantis.svc.cluster.local:7777"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcf-dep
  namespace: volantis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "pcf"
      plmnId: "001-01"
  template:
    metadata:
      labels:
        app: "pcf"
        plmnId: "001-01"
    spec:
      volumes:
        - name: nf-config
          configMap:
            name: pcf-config
      containers:
        - name: pcf
          image: volantis-pcf:latest
          imagePullPolicy: IfNotPresent
          command: ["./pcf"]
          args: ["-c", "/etc/config/pcf.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: nf-config
          ports:
            - name: sbi
              containerPort: 9001
            - name: agent
              containerPort: 7001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          # /ready on the agent port is the mesh's own answer to "is this
          # instance selectable": 503 with "active": false until the NF has
          # pulled its configuration from NSM and opened its SBI gate.
          readinessProbe:
            httpGet:
              path: /ready
              port: 7001
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # the gateway reads this pod through the API server to take its
            # labels; POD_NAME/POD_NAMESPACE are how it is told which pod
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
