{{- if .Values.autoscaler.enabled }}
{{- $a := .Values.autoscaler }}
{{- if not (has $a.kind (list "hpa" "nfautoscaler")) }}
{{- fail (printf "autoscaler.kind must be \"hpa\" or \"nfautoscaler\", got %q" $a.kind) }}
{{- end }}

{{- if .Values.amf.enabled }}
{{- range .Values.amf.sets }}
{{- if gt (int .replicas) 0 }}
---
{{- if eq $a.kind "hpa" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amf-{{ .id }}-hpa
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amf-{{ .id }}-dep
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.hpa.targetCPUUtilizationPercentage }}
{{- else }}
apiVersion: autoscaling.volantis/v1
kind: NFAutoscaler
metadata:
  name: amf-{{ .id }}-autoscaler
  namespace: {{ $.Release.Namespace }}
spec:
  targetDeployment: amf-{{ .id }}-dep
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  pollingIntervalSeconds: {{ $a.nfautoscaler.pollingIntervalSeconds }}
  amfCapacity:
    registeredUEsPerPod: {{ $a.nfautoscaler.amf.registeredUEsPerPod }}
    registrationsPerSecondPerPod: {{ $a.nfautoscaler.amf.registrationsPerSecondPerPod }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.smf.enabled }}
{{- range .Values.smf.slices }}
---
{{- if eq $a.kind "hpa" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smf-{{ .name }}-hpa
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smf-{{ .name }}-dep
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.hpa.targetCPUUtilizationPercentage }}
{{- else }}
apiVersion: autoscaling.volantis/v1
kind: NFAutoscaler
metadata:
  name: smf-{{ .name }}-autoscaler
  namespace: {{ $.Release.Namespace }}
spec:
  targetDeployment: smf-{{ .name }}-dep
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  pollingIntervalSeconds: {{ $a.nfautoscaler.pollingIntervalSeconds }}
  smfCapacity:
    sessionsPerPod: {{ $a.nfautoscaler.smf.sessionsPerPod }}
    sessionCreatePerSecondPerPod: {{ $a.nfautoscaler.smf.sessionCreatePerSecondPerPod }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
